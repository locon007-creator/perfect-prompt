<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#011126" />
  <link rel="stylesheet" href="/src/selector-layout.css" />
  <title>Perfect Prompt</title>
  <script>
    (() => {
      const transientKeys = [
        'perfect-prompt:last',
        'perfect-prompt:idea',
        'perfect-prompt:prompt',
        'perfect-prompt:generation',
        'perfect-prompt:session',
        'perfect-prompt:parsed-lock',
        'perfect-prompt:inference'
      ];
      for (const key of transientKeys) {
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
      }
      window.name = '';
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
