name: Verify Perfect Prompt

on:
  pull_request:
  push:
    branches:
      - visual/approved-generator-layout

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval
      - run: npm run typecheck
      - run: npm run build
